services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: doip-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DOIP_SECRET=doip-production-secret-change-me
      - PYTHONUNBUFFERED=1
    volumes:
      - doip_data:/app/backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: doip-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  doip_data:
