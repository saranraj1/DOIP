name: "SC-8 HADR Deployment — Flood Relief"
id: "SC-8"
area: "geo/basin_flood_zone.geojson"
sim_start: "2026-01-17T06:00:00"
duration_minutes: 360
seed: 8001

entities:
  - id: hadr_hq
    type: depot
    callsign: "DISASTER-RELIEF-HUB"
    start: [77.52, 12.91]
    behavior: idle
    patrol_zone: "staging_area"
    personnel: 40
    battery_pct: 100
    resources: { fuel: 6000, medkit: 600, food: 4000, battery: 400 }
  - id: boat1
    type: vehicle
    callsign: "RESCUE-BOAT-1"
    start: [77.54, 12.93]
    behavior: respond
    patrol_zone: "river_basin"
    personnel: 4
    battery_pct: 100
    resources: { fuel: 100, medkit: 30, food: 100, battery: 100 }

entity_groups:
  - count: 8
    id_prefix: "boat"
    start_index: 2
    template:
      type: vehicle
      behavior: respond
      patrol_zone: "submerged_sector_alpha"
      personnel: 3
      battery_pct: 98
      resources: { fuel: 100, medkit: 25, food: 80, battery: 98 }
  - count: 10
    id_prefix: "relief"
    start_index: 1
    template:
      type: ground_team
      behavior: patrol
      patrol_zone: "evacuation_camp"
      personnel: 5
      battery_pct: 95
      resources: { fuel: 90, medkit: 10, food: 150, battery: 95 }
  - count: 5
    id_prefix: "survey_uav"
    start_index: 1
    template:
      type: drone
      behavior: patrol
      patrol_zone: "flood_crest_survey"
      personnel: 0
      battery_pct: 95
      resources: { fuel: 90, medkit: 0, food: 0, battery: 95 }

timeline:
  - at: "+00:30"
    action: spawn_weather
    params:
      kind: rain
      intensity: 0.9
      center: [77.54, 12.93]
      radius_km: 12.0
      drift_kmh: 8.0
  - at: "+01:30"
    action: create_incident
    params:
      kind: medical
      target: hadr_hq
      severity: high
      rationale: "Civilian evacuation boat stranded in surge zone — SOP-08 response active"
  - at: "+03:00"
    action: raise_alert
    params:
      target: "BASE_AIR_DEFENCE"
      severity: medium
      message: "River crest monitoring pass 2 complete"

rules:
  - when: unit_in_weather(boat1, rain, 0.6)
    then:
      action: modify_speed
      params: { unit: boat1, multiplier: 0.75 }

end_conditions:
  - sim_time_elapsed
