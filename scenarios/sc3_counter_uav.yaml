name: "SC-3 Counter-UAV Airspace Watch"
id: "SC-3"
area: "geo/airspace_grid.geojson"
sim_start: "2026-01-12T06:00:00"
duration_minutes: 240
seed: 3001

entities:
  - id: cu1
    type: ground_team
    callsign: "SHIELD-1"
    start: [77.56, 12.98]
    behavior: patrol
    patrol_zone: "radar_outer_ring"
    personnel: 4
    battery_pct: 100
    resources: { fuel: 100, medkit: 4, food: 100, battery: 100 }
  - id: cu2
    type: ground_team
    callsign: "SHIELD-2"
    start: [77.54, 12.96]
    behavior: patrol
    patrol_zone: "radar_inner_ring"
    personnel: 4
    battery_pct: 100
    resources: { fuel: 100, medkit: 4, food: 100, battery: 100 }
  - id: d1
    type: depot
    callsign: "AIR_DEFENCE_DEPOT"
    start: [77.55, 12.97]
    behavior: idle
    patrol_zone: "central_hub"
    personnel: 16
    battery_pct: 100
    resources: { fuel: 4000, medkit: 150, food: 800, battery: 240 }

entity_groups:
  - count: 12
    id_prefix: "u"
    start_index: 1
    template:
      type: drone
      behavior: patrol
      patrol_zone: "counter_uav_cap"
      personnel: 0
      battery_pct: 95
      resources: { fuel: 90, medkit: 0, food: 0, battery: 95 }
  - count: 13
    id_prefix: "cu"
    start_index: 3
    template:
      type: ground_team
      behavior: patrol
      patrol_zone: "airspace_perimeter"
      personnel: 3
      battery_pct: 98
      resources: { fuel: 95, medkit: 2, food: 95, battery: 98 }

timeline:
  - at: "+00:20"
    action: create_incident
    params:
      kind: signal-jamming
      target: cu1
      severity: high
      rationale: "Broadband GPS disruption detected on Northern ingress vector"
  - at: "+01:00"
    action: spawn_weather
    params:
      kind: wind
      intensity: 0.6
      center: [77.56, 12.97]
      radius_km: 5.0
      drift_kmh: 25.0
  - at: "+02:15"
    action: raise_alert
    params:
      target: "BASE_AIR_DEFENCE"
      severity: critical
      message: "Unidentified swarm signature detected — SOP-05 initiated"

rules:
  - when: unit_in_weather(u1, wind, 0.5)
    then:
      action: modify_speed
      params: { unit: u1, multiplier: 0.8 }

end_conditions:
  - sim_time_elapsed
