<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#052E16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="14" fill="#090D12" stroke="#1F2937" stroke-width="2"/>
  <circle cx="32" cy="32" r="26" fill="url(#radarGlow)"/>
  
  <!-- Radar concentric circles -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#10B981" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3 3"/>
  <circle cx="32" cy="32" r="16" fill="none" stroke="#10B981" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="32" cy="32" r="8" fill="none" stroke="#10B981" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Crosshairs -->
  <line x1="32" y1="4" x2="32" y2="60" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.4"/>
  <line x1="4" y1="32" x2="60" y2="32" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Tactical Chevrons / Center Target Shield -->
  <polygon points="32,16 44,24 44,40 32,48 20,40 20,24" fill="#061E14" stroke="#10B981" stroke-width="2"/>
  <polygon points="32,22 40,28 40,38 32,43 24,38 24,28" fill="url(#shieldGrad)" fill-opacity="0.2" stroke="#34D399" stroke-width="1"/>
  
  <!-- Target Center Dot -->
  <circle cx="32" cy="32" r="3" fill="#34D399"/>
</svg>
